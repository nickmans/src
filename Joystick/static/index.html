<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OMNI Joystick</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>OMNI Joystick</h1>
        <div class="status-wrap">
          <span id="wsStatus" class="status-pill disconnected">WS Disconnected</span>
          <span id="btStatus" class="status-pill disconnected">LINK Disconnected</span>
        </div>
      </header>

      <section class="panel metrics">
        <div class="metric-card">
          <div class="metric-label">Direction</div>
          <div id="angleValue" class="metric-value">0°</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Speed</div>
          <div id="speedValue" class="metric-value">0</div>
        </div>
      </section>

      <section class="panel joystick-panel">
        <div class="joystick-wrap">
          <div id="joystick" class="joystick" aria-label="Virtual joystick" role="application">
            <div class="ring ring-outer"></div>
            <div class="ring ring-inner"></div>
            <div id="stick" class="stick"></div>
          </div>
        </div>
        <div class="spin-rail" aria-label="Spin controls">
          <button id="spin2Btn" class="btn btn-primary" type="button">Spin 2</button>
          <button id="spin1Btn" class="btn btn-primary" type="button">Spin 1</button>
          <button id="spin0Btn" class="btn btn-primary" type="button">Spin 0</button>
          <button id="focusBtn" class="btn btn-primary" type="button">focus on</button>
          <button id="faceForwardBtn" class="btn btn-primary" type="button">face fwd on</button>
        </div>
      </section>

      <section class="panel controls">
        <div id="operatorNotice" class="operator-notice" hidden></div>
        <button id="joyModeBtn" class="btn btn-primary" type="button">Enable Joystick Mode</button>
        <button id="estopBtn" class="btn btn-danger" type="button">Emergency Stop</button>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
